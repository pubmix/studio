[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The Teensy also shows up as a serial port (COM4); without this PlatformIO may pick it.
upload_port = COM6
build_flags =
    -DLCM_SPI_HZ=8000000
    -DLCM_FAST_SPI_HZ=20000000
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
