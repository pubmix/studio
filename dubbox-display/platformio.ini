[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The Teensy also shows up as a serial port (COM4); without this PlatformIO may pick it.
upload_port = COM6
build_flags =
    -DLCM_SPI_HZ=8000000
    -DLCM_FAST_SPI_HZ=20000000
; Bluetooth Classic (A2DP source) does not fit the default 1.3 MB app slot. huge_app keeps the same
; NVS partition (0x9000), so saved WiFi / MIDI settings survive; it just drops OTA, which is unused.
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.8
