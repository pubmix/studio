[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
; Both boards expose serial ports. Always pass the verified ESP32 port explicitly
; when uploading: pio run -d dubbox-display -t upload --upload-port YOUR_ESP32_PORT
build_flags =
    -DLCM_SPI_HZ=8000000
    -DLCM_FAST_SPI_HZ=20000000
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9

    bblanchon/ArduinoJson@6.21.5
