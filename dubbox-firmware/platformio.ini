; Dub-Box firmware — Teensy 4.1 4-track hardware DAW
; https://docs.platformio.org/page/projects/index.html
;
; The UI runs on a separate ESP32 touchscreen (../dubbox-display), linked over UART.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
; teensy-cli blocks until it actually finds/flashes the board and reports a real
; pass/fail, unlike the default teensy-gui protocol on Windows, which launches a
; separate helper window and returns before confirming anything.
upload_protocol = teensy-cli

lib_deps =
    paulstoffregen/Encoder
    thomasfredericks/Bounce2

build_flags =
    -std=gnu++17
    ; Adds an MTP "disk" endpoint alongside the same Serial port, so the SD card shows
    ; up as a drive on the PC (drag-and-drop WAV upload) without giving up Serial. This
    ; is the Teensyduino core's USB-mode selector (Arduino IDE: Tools > USB Type); MTP
    ; itself (<MTP_Teensy.h>) ships in the core, so it is NOT a lib_deps entry (adding
    ; one duplicates the core's class definitions).
    ;
    ; USB MIDI runs through the ESP32 display instead of this port (a software serial-MIDI
    ; bridge on the computer, e.g. Hairless MIDI<->Serial) — see dubbox-display/src/midi_bridge.*
    ; — so this stays MTP + Serial rather than switching to a MIDI USB personality.
    -DUSB_MTPDISK_SERIAL
build_unflags =
    -std=gnu++14

; Audio, SD, SPI, and Wire ship with the Teensy core (framework-arduinoteensy)
; and don't need to be listed here.

; Bench-only extras (1 kHz test tone, pan test 'p'/'t'/'x' on USB serial, spectrum print) are compiled
; only when -DDUBBOX_TEST_TONE is added to build_flags above. It is OFF in normal builds because it
; adds an FFT, extra mixers and audio blocks to the graph.
