<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 716" role="img">
<title>Dub-Box instrument input: TL072 buffer wiring for channel 1</title>
<desc>The 1/4 inch jack tip goes through a 1k resistor and a 0.1 microfarad capacitor to TL072 pin 3, biased to Vb through 1 megohm. The TL072 is a unity follower, its output goes through a 10 microfarad capacitor and a 22k resistor into the INA163 pin 5 node. A bias divider makes Vb, and the unused second half is parked.</desc>
<style>
:root{--s:#5F5E5A;--t:#888780}
svg{background:#fff;font-family:Arial,Helvetica,sans-serif}
.t,.ts,.th{fill:#2C2C2A}
.ts{font-size:12px;fill:#444441}
.th{font-size:14px;font-weight:700}
.box{fill:#F1EFE8;stroke:#888780}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="14" y="16" dominant-baseline="central">Channel 1: instrument buffer</text>
<rect class="box" x="14" y="70" width="100" height="200" rx="3" stroke-width="0.5"/>
<text class="th" x="64" y="84" text-anchor="middle" dominant-baseline="central">1/4 in jack</text>
<text class="ts" x="106" y="130" text-anchor="end" dominant-baseline="central">T (tip)</text>
<text class="ts" x="106" y="190" text-anchor="end" dominant-baseline="central">TS</text>
<text class="ts" x="106" y="240" text-anchor="end" dominant-baseline="central">S (sleeve)</text>
<path d="M114 190 L140 190" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<text class="ts" x="146" y="190" dominant-baseline="central">GND</text>
<path d="M114 240 L140 240" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<text class="ts" x="146" y="240" dominant-baseline="central">GND</text>
<path d="M114 130 L130 130" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<path d="M158 130 L170 130" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<path d="M210 130 L310 130" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<rect class="box" x="130" y="121" width="28" height="18" rx="3" stroke-width="0.5"/>
<text class="ts" x="144" y="130" text-anchor="middle" dominant-baseline="central">1k</text>
<rect class="box" x="170" y="121" width="40" height="18" rx="3" stroke-width="0.5"/>
<text class="ts" x="190" y="130" text-anchor="middle" dominant-baseline="central">0.1µF</text>
<circle cx="270" cy="130" r="2.5" fill="#BA7517"/>
<path d="M270 130 L270 150" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<path d="M270 184 L270 198" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<rect class="box" x="261" y="150" width="18" height="34" rx="3" stroke-width="0.5"/>
<text class="ts" x="285" y="167" dominant-baseline="central">1M</text>
<text class="ts" x="270" y="210" text-anchor="middle" dominant-baseline="central">Vb</text>
<g class="c-purple">
<rect x="310" y="70" width="140" height="190" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="84" text-anchor="middle" dominant-baseline="central">TL072 (half A)</text>
<text class="ts" x="350" y="100" text-anchor="middle" dominant-baseline="central">8 V+</text>
<text class="ts" x="410" y="100" text-anchor="middle" dominant-baseline="central">4 V−</text>
<text class="ts" x="318" y="130" dominant-baseline="central">3 +</text>
<text class="ts" x="318" y="200" dominant-baseline="central">2 −</text>
<text class="ts" x="442" y="200" text-anchor="end" dominant-baseline="central">1 out</text>
</g>
<path d="M350 70 L350 34" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<text class="ts" x="350" y="24" text-anchor="middle" dominant-baseline="central">+5 V</text>
<circle cx="350" cy="62" r="2.5" fill="var(--s)"/>
<path d="M350 62 L320 62" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<path d="M320 62 L320 54" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<rect class="box" x="311" y="30" width="18" height="24" rx="3" stroke-width="0.5"/>
<path d="M320 30 L320 22" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<text class="ts" x="316" y="12" text-anchor="middle" dominant-baseline="central">GND</text>
<path d="M410 70 L410 34" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<text class="ts" x="410" y="24" text-anchor="middle" dominant-baseline="central">V−1</text>
<circle cx="410" cy="62" r="2.5" fill="var(--s)"/>
<path d="M410 62 L440 62" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<path d="M440 62 L440 54" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<rect class="box" x="431" y="30" width="18" height="24" rx="3" stroke-width="0.5"/>
<path d="M440 30 L440 22" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<text class="ts" x="444" y="12" text-anchor="middle" dominant-baseline="central">GND</text>
<text class="ts" x="306" y="42" text-anchor="end" dominant-baseline="central">0.1µF</text>
<text class="ts" x="456" y="42" dominant-baseline="central">0.1µF</text>
<path d="M450 200 L480 200" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<circle cx="480" cy="200" r="2.5" fill="#BA7517"/>
<path d="M480 200 L480 285 L290 285 L290 200 L310 200" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<text class="ts" x="385" y="300" text-anchor="middle" dominant-baseline="central">pin 1 tied to pin 2 (follower)</text>
<path d="M480 200 L500 200" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<path d="M540 200 L560 200" fill="none" stroke="#BA7517" stroke-width="1.2"/>
<path d="M596 200 L650 200" fill="none" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect class="box" x="500" y="191" width="40" height="18" rx="3" stroke-width="0.5"/>
<text class="ts" x="520" y="200" text-anchor="middle" dominant-baseline="central">10µF</text>
<rect class="box" x="560" y="191" width="36" height="18" rx="3" stroke-width="0.5"/>
<text class="ts" x="578" y="200" text-anchor="middle" dominant-baseline="central">22k</text>
<text class="ts" x="496" y="186" text-anchor="end" dominant-baseline="central">+</text>
<text class="ts" x="670" y="170" text-anchor="end" dominant-baseline="central">to INA163 pin 5 node</text>
<rect class="box" x="480" y="320" width="190" height="100" rx="3" stroke-width="0.5"/>
<text class="th" x="575" y="336" text-anchor="middle" dominant-baseline="central">TL072 half B</text>
<text class="ts" x="490" y="362" dominant-baseline="central">pin 6 (−) tied to pin 7</text>
<text class="ts" x="490" y="382" dominant-baseline="central">pin 5 (+) tied to Vb</text>
<text class="ts" x="490" y="402" dominant-baseline="central">unused for now</text>
<text class="th" x="14" y="330" dominant-baseline="central">Bias point Vb</text>
<text class="ts" x="60" y="350" text-anchor="middle" dominant-baseline="central">+5 V</text>
<path d="M60 358 L60 370" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<path d="M60 402 L60 430" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<path d="M60 462 L60 480" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<rect class="box" x="51" y="370" width="18" height="32" rx="3" stroke-width="0.5"/>
<text class="ts" x="75" y="386" dominant-baseline="central">100k</text>
<rect class="box" x="51" y="430" width="18" height="32" rx="3" stroke-width="0.5"/>
<text class="ts" x="75" y="446" dominant-baseline="central">100k</text>
<circle cx="60" cy="416" r="2.5" fill="var(--s)"/>
<text class="ts" x="88" y="404" dominant-baseline="central">Vb</text>
<text class="ts" x="60" y="492" text-anchor="middle" dominant-baseline="central">V−1</text>
<path d="M60 416 L150 416" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<path d="M150 416 L150 426" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<path d="M150 464 L150 480" fill="none" stroke="var(--s)" stroke-width="1.2"/>
<rect class="box" x="141" y="426" width="18" height="38" rx="3" stroke-width="0.5"/>
<text class="ts" x="165" y="445" dominant-baseline="central">10µF</text>
<text class="ts" x="136" y="434" text-anchor="end" dominant-baseline="central">+</text>
<text class="ts" x="150" y="492" text-anchor="middle" dominant-baseline="central">GND</text>
<text class="ts" x="230" y="380" dominant-baseline="central">Check: Vb is about +0.3 V</text>
<text class="ts" x="230" y="398" dominant-baseline="central">Then TL072 pin 1 is about +0.3 V</text>
<text class="th" x="14" y="524" dominant-baseline="central">Where these points are on your breadboard</text>
<text class="ts" x="14" y="546" dominant-baseline="central">+5 V:  the bench supply rail (INA163 pin 11, ICL7660S pins 1 and 8)</text>
<text class="ts" x="14" y="564" dominant-baseline="central">V−1:  the ICL7660S pin 5 node (also INA163 pin 6 and the C2 − leg)</text>
<text class="ts" x="14" y="582" dominant-baseline="central">GND:  the shared ground (bench supply −, ICL7660S pin 3, Audio Shield G pad)</text>
<text class="ts" x="14" y="600" dominant-baseline="central">Vb:  a NEW point made by the bias block above; nothing built so far uses it</text>
<text class="ts" x="14" y="618" dominant-baseline="central">INA163 pin 5 node:  the VIN+ line after the 47 Ω, right at pin 5</text>
<text class="ts" x="14" y="654" dominant-baseline="central">Jack terminals used: T tip, TS tip switch, S sleeve. R, RS and SS stay unconnected.</text>
<text class="ts" x="14" y="670" dominant-baseline="central">TS shorts the tip to GND when nothing is plugged in, so the buffer stays quiet.</text>
<text class="ts" x="14" y="686" dominant-baseline="central">For an instrument set the INA163 RG to the 5k pot (gain about 2): 54x would clip.</text>
<text class="ts" x="14" y="702" dominant-baseline="central">Labels Vb, +5 V, V−1 and GND mean: connect to that point. Channel 2 copies this.</text>
</svg>